<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-primary">✏️ Edit Product</h3>
            <a href="{% url 'product_list' %}" class="btn btn-secondary btn-sm">Cancel</a>
        </div>
        
        <div class="card shadow-sm p-4">
            <h5 class="mb-3 text-muted">Updating SKU: {{ product.sku }}</h5>
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label small text-muted">{{ field.label }}</label>
                        {{ field }}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-warning w-100 mt-2 fw-bold">Update Product</button>
            </form>
        </div>
    </div>
</body>
</html>
