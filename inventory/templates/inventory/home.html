<!DOCTYPE html>
<html>
<head>
    <title>Control Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary">⚙️ Admin Control Panel</h2>
            <form action="{% url 'logout' %}" method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger">Logout</button>
            </form>
        </div>
        
        <div class="row g-4">
            <!-- Products Block -->
            <div class="col-md-4">
                <a href="{% url 'product_list' %}" class="text-decoration-none">
                    <div class="card shadow-sm h-100 text-center text-dark hover-shadow p-4">
                        <h2>📦</h2>
                        <h4>Products</h4>
                        <p class="text-muted small">Manage inventory and stock</p>
                    </div>
                </a>
            </div>
            <!-- Staff Block -->
            <!-- Staff Block (Sirf Admin ko dikhega) -->
            {% if user.is_superuser %}
            <div class="col-md-4">
                <a href="{% url 'staff_list' %}" class="text-decoration-none">
                    <div class="card shadow-sm h-100 text-center text-dark p-4">
                        <h2>👥</h2>
                        <h4>Staff Directory</h4>
                        <p class="text-muted small">Manage users and access</p>
                    </div>
                </a>
            </div>
            {% endif %}
            <!-- Orders Block (Placeholder for future) -->
            <div class="col-md-4">
                <a href="{% url 'order_list' %}" class="text-decoration-none">
                    <div class="card shadow-sm h-100 text-center text-dark p-4">
                        <h2>🛒</h2>
                        <h4>Orders</h4>
                        <p class="text-muted small">Coming soon</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
